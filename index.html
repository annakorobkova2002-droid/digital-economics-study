<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Economy Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, focused study tool with a newspaper graphics desk's clarity.
   IDEA: an exam booklet plus a deck of index cards.
   PICTURE: the working tool itself — countdown + topic mastery bars; the card or question on other views.
   COLOUR/TYPE: white/black with one vermilion (#ff4a1c) mass; Sofia Sans Condensed 800 + Instrument Sans.
   LAYOUT: sticky tab bar, 1100px column, stacks to one column under 600px. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#120d0b);--ink:light-dark(#121212,#f3eee9);--mut:light-dark(#5d5a57,#aaa29b);--line:light-dark(#e4e0db,#2f2723);--card:light-dark(#f6f4f1,#1d1613);--acc:#ff4a1c;--accink:#140803;--ok:light-dark(#0a7a3d,#52c98a);--okbg:light-dark(#e6f5ec,#10291b);--bad:light-dark(#c32a0e,#ff8064);--badbg:light-dark(#fdeae5,#331510)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Sofia Sans Condensed","Arial Narrow",sans-serif;font-weight:800;line-height:1.05;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(32px,5vw,52px)}h2{font-size:32px}h3{font-size:22px}
a{color:inherit}
button,select,textarea,input{font:inherit;color:inherit}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .in{max-width:1140px;margin:auto;display:flex;align-items:center;gap:4px;padding:0 max(3vw,12px);overflow-x:auto;scrollbar-width:none}
.nav .brand{font:800 20px "Sofia Sans Condensed",sans-serif;margin-right:12px;white-space:nowrap;text-decoration:none}
.nav .brand b{color:var(--acc)}
.nav a.t{flex:none;padding:14px 10px;text-decoration:none;color:var(--mut);font-weight:600;font-size:15px;border-bottom:3px solid transparent;min-height:48px}
.nav a.t.on{color:var(--ink);border-color:var(--acc)}
main{max-width:1140px;margin:auto;padding:clamp(20px,3vw,40px) max(3vw,14px) 60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;font-weight:600;cursor:pointer;text-decoration:none}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.btn.s{border-color:var(--line);background:var(--card)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,a:focus-visible,.fc:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mut{color:var(--mut)}.sm{font-size:14px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:stretch}
.count{background:var(--acc);color:var(--accink);border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between;min-height:250px;position:relative;overflow:hidden}
.count .n{font:800 clamp(96px,15vw,170px)/.85 "Sofia Sans Condensed",sans-serif;letter-spacing:-2px}
.count .l{font-weight:700;font-size:18px}
.count svg{position:absolute;right:-30px;bottom:-30px;width:220px;opacity:.18}
.fmt{border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.fmt table{width:100%;border-collapse:collapse;font-size:15px}
.fmt td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.fmt td:last-child{text-align:right;white-space:nowrap;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:26px 0}
.stat{background:var(--card);border-radius:14px;padding:16px 18px}
.stat b{display:block;font:800 36px/1 "Sofia Sans Condensed",sans-serif}
.stat span{font-size:14px;color:var(--mut)}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 150px 52px;gap:14px;align-items:center;padding:10px 12px;border-radius:10px;text-decoration:none}
.bar:hover{background:var(--card)}
.bar .tr{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar .pc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ln{display:inline-block;min-width:30px;margin-right:6px;font:800 18px/1 "Sofia Sans Condensed",sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}
.tbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 6px}.tbar i{display:block;height:100%;background:var(--acc)}
.focusbox{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;background:var(--card);border-radius:16px;padding:18px 20px;margin-top:16px}.focusbox>div:first-child{flex:1 1 260px}
.kplist{display:grid;gap:10px;max-width:860px}
.kpc{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:start;border:1.5px solid var(--line);border-radius:14px;padding:16px 16px 14px;background:var(--bg);transition:opacity .2s}
.kpc.done{opacity:.55}.kpc.done .kn{background:var(--ok);color:var(--bg)}
.kn{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;font:800 18px "Sofia Sans Condensed",sans-serif}
.kpc h4{margin:4px 0 6px;font-size:18px;line-height:1.3}
.kpc p{margin:0;line-height:1.6;font-weight:400}
.kpc .arr,.flow .arr{color:var(--acc);font-weight:800;padding:0 2px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}.flow .st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:600;font-size:15px}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;font-size:20px;color:var(--mut)}.tick.on{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.defgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dt{text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg);cursor:pointer;min-height:96px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.dt b{font-size:16px}.dt .dq{color:var(--acc);font-size:13px;font-weight:600}.dt .da{display:none;line-height:1.45}
.dt.open{background:var(--card);border-color:var(--ink)}.dt.open .dq{display:none}.dt.open .da{display:block}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--ink);font-size:14px}
.focus{max-width:760px;margin:auto}
.dots{display:flex;gap:4px;margin:16px 0 26px}.dots i{flex:1;height:6px;border-radius:4px;background:var(--line)}.dots i.qd{background:light-dark(#d5cfc9,#3a302b)}.dots i.past{background:var(--ok)}.dots i.now{background:var(--acc)}
.kpc.big{grid-template-columns:52px minmax(0,1fr);padding:28px 26px;border-width:2px;min-height:240px;align-content:center}.kpc.big .kn{width:48px;height:48px;font-size:24px}
.kpc.big h4{font:800 clamp(26px,3.6vw,34px)/1.1 "Sofia Sans Condensed",sans-serif;margin:4px 0 12px}.kpc.big p{font-size:clamp(19px,2.4vw,22px);line-height:1.55}.kpc.big .flow .st{font-size:18px;padding:8px 14px}
.fbtns{justify-content:flex-end;margin-top:18px}.fhint{text-align:right;margin-top:10px}
.fend{text-align:center;padding:30px 0}
@media(max-width:600px){.kpc{grid-template-columns:32px minmax(0,1fr) auto;gap:10px;padding:14px 12px}.kn{width:30px;height:30px;font-size:16px}.kpc.big{grid-template-columns:minmax(0,1fr);padding:22px 18px}.fbtns{justify-content:stretch}.fbtns .btn{flex:1}}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--card);color:var(--mut);margin-left:6px;white-space:nowrap}
.panel{border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:18px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{min-height:40px;padding:8px 14px;border-radius:30px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{min-height:44px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
.q{max-width:760px}
.q .meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut);margin-bottom:10px}
.q .stem{font-size:clamp(19px,2.4vw,23px);font-weight:600;line-height:1.35;margin:0 0 18px}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:22px}.prog i{display:block;height:100%;background:var(--acc)}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:14px 16px;margin:0 0 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;min-height:52px;font-size:16px;line-height:1.4}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:var(--card)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}.opt.no .k{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt:disabled{cursor:default}
.exp{border-left:4px solid var(--acc);background:var(--card);padding:14px 16px;border-radius:0 12px 12px 0;margin:16px 0}
.exp b.y{color:var(--ok)}.exp b.n{color:var(--bad)}
.fcwrap{max-width:680px;margin:auto}
.fc{perspective:1400px;cursor:pointer;height:clamp(260px,42vh,360px);margin-bottom:18px}
.fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:28px;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:auto}
.fc .f{background:var(--card);border:1px solid var(--line);font:800 clamp(24px,3.4vw,34px)/1.1 "Sofia Sans Condensed",sans-serif}
.fc .b{background:var(--ink);color:var(--bg);transform:rotateY(180deg);font-size:clamp(17px,2.2vw,20px);line-height:1.45}
.fc small{position:absolute;top:14px;left:18px;font:600 12px "Instrument Sans",sans-serif;opacity:.7;text-align:left}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{display:block;text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tile:hover{border-color:var(--ink)}
.tile h3{font-size:21px;margin-bottom:6px}
ul.kp{padding-left:1.1em;max-width:820px}ul.kp li{margin:0 0 9px}
table.cards{width:100%;border-collapse:collapse;font-size:15px}
table.cards td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.cards td:first-child{font-weight:600;width:38%}
.timer{font:800 30px "Sofia Sans Condensed",sans-serif;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.navgrid{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.navgrid button{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;font-size:14px}
.navgrid button.a{background:var(--card);border-color:var(--mut)}
.navgrid button.c{border-color:var(--acc);border-width:3px}
.navgrid button.ok{background:var(--okbg);border-color:var(--ok)}.navgrid button.no{background:var(--badbg);border-color:var(--bad)}
textarea{width:100%;min-height:340px;padding:16px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;line-height:1.55;resize:vertical}
.model{display:grid;gap:10px}
.model div{background:var(--card);border-radius:12px;padding:14px 16px}
.model b{display:block;margin-bottom:4px}
.check label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:22px;height:22px;flex:none;accent-color:var(--acc);margin-top:2px}
.big{font:800 clamp(56px,9vw,96px)/.9 "Sofia Sans Condensed",sans-serif}
.sync{font-size:13px;color:var(--mut);text-align:center;padding:20px}
.empty{padding:40px 20px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:16px}
.badge{display:inline-block;background:var(--acc);color:var(--accink);font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:8px}
.hero2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media(max-width:760px){.hero,.hero2{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.count{min-height:200px}}
@media(max-width:600px){.bar{grid-template-columns:minmax(0,1fr) 70px 44px;gap:10px;padding:10px 4px}table.cards td{display:block;width:auto!important;border:0;padding:4px 0}table.cards tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}.nav .brand{display:none}}
@media(prefers-reduced-motion:reduce){.fc .in{transition:none}}
</style>
</head>
<body>
<nav class="nav"><div class="in" id="nav">
 <a class="brand" href="#home">Digital Economy <b>Prep</b></a>
 <a class="t" href="#home" data-v="home">Home</a>
 <a class="t" href="#learn" data-v="learn">Learn</a>
 <a class="t" href="#cards" data-v="cards">Flashcards</a>
 <a class="t" href="#quiz" data-v="quiz">Quiz</a>
 <a class="t" href="#mock" data-v="mock">Mock exam</a>
 <a class="t" href="#assign" data-v="assign">Assignments</a>
 <a class="t" href="#mistakes" data-v="mistakes">Mistakes</a>
</div></nav>
<main id="app"><p class="mut">Loading your study material…</p></main>
<div class="sync" id="sync">Progress is saved in this browser.</div>
<script>
{
const EXAM = new Date(2026, 11, 2);
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const LET = 'ABCD';
const lname = id => 'Chapter ' + TOP[id].n + ' · ' + TOP[id].title;

let B = null, TOP = {}, Q = [], QI = {}, C = [];
let S = {v: 1, ts: 0, q: {}, k: {}, a: {}, m: [], r: {}};
let sess = {cards: null, quiz: null, mock: null};
let timers = {};

/* ---------- persistence ---------- */
const LS = 'mode-prep-v1';
try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
let dbRef = null, writing = false, pending = false, wTimer = null;
const setSync = t => { document.getElementById('sync').textContent = t; };
function save() {
  S.ts = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  if (dbRef) { clearTimeout(wTimer); wTimer = setTimeout(push, 1500); }
}
async function push() {
  if (!dbRef) return;
  if (writing) { pending = true; return; }
  writing = true;
  try { await dbRef.set(JSON.parse(JSON.stringify(S))); setSync('Progress saved to your Claude account — it follows you across devices.'); }
  catch (e) { if (e && e.code === 'invalid_argument') { dbRef = null; setSync('Progress is saved in this browser only.'); } }
  writing = false;
  if (pending) { pending = false; push(); }
}
(async () => {
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const to = new Promise(r => setTimeout(() => r('timeout'), 10000));
    const snap = await Promise.race([ref.get(), to]);
    if (snap === 'timeout') { setSync('Could not reach your account yet — progress is saved in this browser.'); return; }
    dbRef = ref;
    const remote = snap.exists ? snap.data() : null;
    if (remote && (remote.ts || 0) > (S.ts || 0)) {
      S = Object.assign({v: 1, ts: 0, q: {}, k: {}, a: {}, m: [], r: {}}, JSON.parse(JSON.stringify(remote)));
      try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
      if (B) route();
    } else if (S.ts) { push(); }
    setSync('Progress saved to your Claude account — it follows you across devices.');
  } catch (e) {}
})();

/* ---------- data ---------- */
function prep() {
  B.topics.forEach(t => {
    TOP[t.id] = t;
    t.mcq.forEach((m, i) => Q.push({id: t.id + '-m' + i, t: t.id, type: 'mcq', q: m.q, o: m.o, c: m.o[0], e: m.e}));
    t.tf.forEach((m, i) => Q.push({id: t.id + '-t' + i, t: t.id, type: 'tf', q: m[0], o: ['True', 'False'], c: m[1] ? 'True' : 'False', e: m[2]}));
    t.cards.forEach((c, i) => C.push({id: t.id + '-c' + i, t: t.id, f: c[0], b: c[1]}));
  });
  Q.forEach(q => QI[q.id] = q);
}
const qOf = t => Q.filter(q => q.t === t);
function mastery(t) {
  const qs = qOf(t); let ok = 0, seen = 0;
  qs.forEach(q => { const r = S.q[q.id]; if (r) { seen++; if (r[2]) ok++; } });
  return {ok, seen, n: qs.length, p: pct(ok, qs.length)};
}
function record(q, right) {
  const r = S.q[q.id] || [0, 0, 0];
  if (right) r[0]++; else r[1]++;
  r[2] = right ? 1 : 0; S.q[q.id] = r; save();
}
const weakest = n => B.topics.map(t => [t.id, mastery(t.id).p]).sort((a, b) => a[1] - b[1]).slice(0, n).map(x => x[0]);

/* ---------- routing ---------- */
function stopTimers() { Object.values(timers).forEach(clearInterval); timers = {}; }
function route(keep) {
  const h = (location.hash || '#home').slice(1);
  const [v, ...rest] = h.split('-'); const arg = rest.join('-');
  document.querySelectorAll('#nav a.t').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  if (v !== 'mock' && v !== 'assign') stopTimers();
  const f = {home, learn, focus, cards, quiz, mock, assign, mistakes}[v] || home;
  document.querySelectorAll('#nav a.t').forEach(a => { if (v === 'focus' && a.dataset.v === 'learn') a.classList.add('on'); });
  f(arg); if (!keep) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ---------- home ---------- */
function home() {
  const days = Math.ceil((EXAM - new Date().setHours(0, 0, 0, 0)) / 864e5);
  const ans = Object.values(S.q); const right = ans.reduce((s, r) => s + r[0], 0), tot = ans.reduce((s, r) => s + r[0] + r[1], 0);
  const known = Object.values(S.k).filter(Boolean).length;
  const best = S.m.length ? Math.max(...S.m.map(m => pct(m.s, m.n))) + '%' : '—';
  const w = weakest(3).map(id => TOP[id].title);
  $app.innerHTML = `
  <div class="hero">
    <div>
      <h1>Management &amp; Organization in the Digital Economy</h1>
      <p class="mut" style="max-width:52ch">Every lecture from your notes, turned into flashcards, quizzes, a timed mock exam and written-assignment practice. ${Q.length} questions · ${C.length} flashcards · ${B.assignments.length} assignment cases.</p>
      <div class="row" style="margin-top:18px">
        <button class="btn p" data-act="weak">Quiz my 3 weakest topics</button>
        <a class="btn" href="#mock">Start a mock exam</a>
        <a class="btn s" href="#cards">Flashcards</a>
      </div>
      <p class="sm mut" style="margin-top:14px">Weakest right now: ${w.map(esc).join(' · ')}</p>
    </div>
    <div class="count">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="8"/><path d="M50 18v32l20 12" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg>
      <div class="l">Written exam · Wednesday 2 December</div>
      <div><div class="n">${days > 0 ? days : days === 0 ? 'Today' : '✓'}</div><div class="l">${days > 1 ? 'days to go' : days === 1 ? 'day to go' : days === 0 ? 'Good luck!' : 'Exam done'}</div></div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b>${Object.keys(S.q).length}<small style="font-size:18px" class="mut">/${Q.length}</small></b><span>questions tried</span></div>
    <div class="stat"><b>${tot ? pct(right, tot) + '%' : '—'}</b><span>accuracy on all attempts</span></div>

/* ---------- learn ---------- */
function splitHead(s) {
  const c = s.indexOf(': ');
  if (c > 0 && c < 70) return [s.slice(0, c), s.slice(c + 2)];
  const e = s.indexOf(' = ');
  if (e > 0 && e < 60 && s.split(' = ').length === 2) return [s.slice(0, e), s.slice(e + 3)];
  return [null, s];
}
function richBody(b) {
  const parts = b.replace(/\.$/, '').split(' → ');
  if (parts.length >= 3 && !/[.;]\s/.test(b.replace(/\.$/, '')) && parts.every(p => p.length < 60))
    return `<div class="flow">${parts.map(p => `<span class="st">${esc(p)}</span>`).join('<span class="arr">→</span>')}</div>`;
  const h = esc(b).replace(/(^|\. |; )([^.;=:<>]{2,45}?) = /g, '$1<b>$2</b> = ').replace(/→/g, '<span class="arr">→</span>');
  return `<p>${h}</p>`;
}
const pid = (id, i) => id + '-p' + i;
const readCount = t => t.summary.filter((_, i) => S.r && S.r[pid(t.id, i)]).length;
const estMin = t => Math.max(2, Math.round(t.summary.join(' ').split(/\s+/).length / 130 + t.summary.length * 0.25));
function pointCard(t, i, big) {
  const [h, b] = splitHead(t.summary[i]); const done = S.r && S.r[pid(t.id, i)];
  return `<div class="kpc ${done ? 'done' : ''} ${big ? 'big' : ''}"><span class="kn">${i + 1}</span><div>${h ? `<h4>${esc(h)}</h4>` : ''}${richBody(b)}</div>${big ? '' : `<button class="tick ${done ? 'on' : ''}" data-act="toggleRead" data-arg="${pid(t.id, i)}" aria-label="${done ? 'Mark as not understood' : 'Mark as understood'}">✓</button>`}</div>`;
}
function learn(id) {
  const t = TOP[id];
  if (!t) {
    $app.innerHTML = `<h1>Learn</h1><p class="mut">Each chapter is split into short cards. Use focus mode to go one card at a time, with quick questions along the way.</p>
    <div class="grid2">${B.topics.map(t => { const m = mastery(t.id), r = readCount(t); return `<a class="tile" href="#learn-${t.id}"><h3><span class="ln" style="font-size:24px;min-width:34px">${t.n}</span>${esc(t.title)}</h3><div class="tbar"><i style="width:${pct(r, t.summary.length)}%"></i></div><div class="sm mut">${r}/${t.summary.length} cards understood · ${m.p}% quiz mastery · ~${estMin(t)} min</div></a>`; }).join('')}</div>`;
    return;
  }
  const cs = C.filter(c => c.t === id); const r = readCount(t);
  $app.innerHTML = `<p class="sm"><a href="#learn">← All chapters</a></p>
  <h1><span class="ln" style="font-size:inherit;min-width:0;margin-right:.25em">${t.n}</span>${esc(t.title)}</h1>
  <p class="mut sm">Chapter ${t.n} · Handbook ch. ${esc(t.hb)} · ${t.part === 'Guest' ? 'Guest lecture' : 'Part ' + esc(t.part)} · ${esc(t.date)}</p>
  <div class="focusbox"><div><b>${r === t.summary.length ? 'Chapter understood — test it now' : r ? `${r} of ${t.summary.length} cards done — keep going` : `${t.summary.length} cards · about ${estMin(t)} minutes`}</b><div class="tbar" style="margin-top:8px"><i style="width:${pct(r, t.summary.length)}%"></i></div></div>
  <div class="row">${r === t.summary.length ? `<button class="btn p" data-act="quizTopic" data-arg="${id}">Quiz this chapter</button>` : `<a class="btn p" href="#focus-${id}">${r ? 'Continue' : 'Start'} focus mode</a>`}<button class="btn s" data-act="cardsTopic" data-arg="${id}">Flashcards</button>${r === t.summary.length ? '' : `<button class="btn s" data-act="quizTopic" data-arg="${id}">Quiz</button>`}</div></div>

  <div class="defgrid">${cs.map(c => `<button class="dt" data-act="flipDef"><b>${esc(c.f)}</b><span class="dq">Tap to reveal</span><span class="da">${esc(c.b)}</span></button>`).join('')}</div>`;
}

/* ---------- focus mode ---------- */
let F = null;
function focus(id) {
  const t = TOP[id]; if (!t) { location.hash = 'learn'; return; }
  if (!F || F.id !== id) {
    const qs = shuffle(Q.filter(q => q.t === id && q.type === 'mcq'));
    const steps = []; let qi = 0;
    t.summary.forEach((_, i) => { steps.push({k: 'p', i}); if ((i + 1) % 3 === 0 && i < t.summary.length - 1 && qs[qi]) { const q = qs[qi++]; steps.push({k: 'q', q, o: shuffle(q.o), a: null}); } });
    if (qs[qi]) { const q = qs[qi]; steps.push({k: 'q', q, o: shuffle(q.o), a: null}); }
    steps.push({k: 'end'});
    let start = steps.findIndex(s => s.k === 'p' && !(S.r && S.r[pid(id, s.i)])); if (start < 0) start = 0;
    F = {id, steps, i: start};
  }
  const s = F.steps[F.i], n = F.steps.length - 1;
  const dots = F.steps.slice(0, -1).map((x, j) => `<i class="${x.k === 'q' ? 'qd' : ''} ${j < F.i ? 'past' : ''} ${j === F.i ? 'now' : ''}"></i>`).join('');
  let inner = '';
  if (s.k === 'p') inner = `${pointCard(t, s.i, true)}<div class="row fbtns"><button class="btn s" data-act="fBack" ${F.i ? '' : 'disabled'}>← Back</button><button class="btn s" data-act="fSkip">Not yet</button><button class="btn p" data-act="fGot">Got it →</button></div><p class="sm mut fhint">→ or Space = got it · ← = back</p>`;
  else if (s.k === 'q') { const done = s.a !== null; inner = `<div class="qcheck"><span class="badge">Quick check</span><p class="stem">${esc(s.q.q)}</p>${s.o.map((o, i) => { let cl = ''; if (done) { if (o === s.q.c) cl = 'ok'; else if (o === s.a) cl = 'no'; } return `<button class="opt ${cl}" data-act="fAns" data-arg="${i}" ${done ? 'disabled' : ''}><span class="k">${LET[i]}</span><span>${esc(o)}</span></button>`; }).join('')}${done ? `<div class="exp"><b class="${s.a === s.q.c ? 'y' : 'n'}">${s.a === s.q.c ? 'Nice!' : 'Not quite.'}</b> ${esc(s.q.e)}</div><div class="row fbtns"><button class="btn p" data-act="fNext">Continue →</button></div>` : ''}</div>`; }
  else { const r = readCount(t); inner = `<div class="fend"><div class="big">${r}/${t.summary.length}</div><h2>cards understood</h2><p class="mut">${r === t.summary.length ? 'Chapter done. Lock it in with a quiz or flashcards while it is fresh.' : 'Cards you marked “not yet” stay unticked — come back to them later.'}</p><div class="row" style="justify-content:center"><button class="btn p" data-act="quizTopic" data-arg="${id}">Quiz this chapter</button><button class="btn s" data-act="cardsTopic" data-arg="${id}">Flashcards</button><a class="btn s" href="#learn-${id}" data-act="fClose">Back to chapter</a></div></div>`; }
  $app.innerHTML = `<div class="focus"><div class="row" style="justify-content:space-between"><span class="sm mut"><span class="ln">${t.n}</span>${esc(t.title)}</span><a class="sm" href="#learn-${id}" data-act="fClose">Exit focus mode</a></div><div class="dots">${dots}</div>${inner}</div>`;
}
function fGo(d) { F.i = Math.max(0, Math.min(F.steps.length - 1, F.i + d)); focus(F.id); }

}

}

  const running = aTimer.id === a.id;
  if (running && !timers.b && aTimer.left > 0) startATimer(a.id, aTimer.left);
  $app.innerHTML = `<p class="sm"><a href="#assign">← All assignments</a></p>
  ${a.badge ? `<span class="badge">${esc(a.badge)}</span>` : ''}<h1>${esc(a.title)}</h1>
  <div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="sm mut">Frameworks: ${a.topics.map(t => `<a href="#learn-${t}">${esc(lname(t))}</a>`).join(' · ')}</span>
  <span class="row">${running ? `<span class="timer ${aTimer.left < 600 ? 'low' : ''}" id="atm">${fmt(aTimer.left)}</span><button class="btn s" data-act="stopATimer">Stop timer</button>` : '<button class="btn s" data-act="startATimer">Start 90-min timer</button>'}</span></div>
  <div class="panel" style="border-color:var(--ink)"><h3>Task</h3><p style="margin:0">${esc(a.prompt)}</p></div>
  <label for="draft" class="sm mut">Your answer (saved as you type)</label>
  <textarea id="draft" data-aid="${a.id}" placeholder="Structure it: define the framework, apply each step to the case, conclude with a clear verdict or recommendation.">${esc(r.d || '')}</textarea>
  <div class="row" style="margin:14px 0"><span class="sm mut" id="wc">${(r.d || '').trim().split(/\s+/).filter(Boolean).length} words</span>${shown ? '' : '<button class="btn p" data-act="reveal">Reveal model answer &amp; checklist</button>'}</div>
  ${shown ? `<div class="panel"><h2>Model answer</h2><div class="model">${a.model.map(m => `<div><b>${esc(m[0])}</b>${esc(m[1])}</div>`).join('')}</div></div>
  <div class="panel"><h2>Score yourself</h2><p class="sm mut">Tick each element your answer covered properly.</p><div class="check">${a.checklist.map((c, i) => `<label><input type="checkbox" data-act="chk" data-arg="${i}" ${(r.c || []).includes(i) ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}</div>
  <p style="margin-top:14px">Score: <b id="ascore">${(r.c || []).length}/${a.checklist.length}</b></p><button class="btn s" data-act="hideModel">Hide model answer and try again</button></div>` : ''}`;
}
function startATimer(id, left) {
  clearInterval(timers.b); const prevEnd = left && aTimer.id === id ? aTimer.end : 0; aTimer = {id, left: left || 5400}; aTimer.end = prevEnd || Date.now() + aTimer.left * 1000;
  timers.b = setInterval(() => {
    aTimer.left = Math.round((aTimer.end - Date.now()) / 1000); const el = document.getElementById('atm');
    if (el) { el.textContent = fmt(Math.max(0, aTimer.left)); el.classList.toggle('low', aTimer.left < 600); }
    if (aTimer.left <= 0) { clearInterval(timers.b); if (el) el.textContent = 'Time!'; }
  }, 1000);
}

/* ---------- mistakes ---------- */
function mistakes() {
  const w = Q.filter(q => S.q[q.id] && !S.q[q.id][2]);
  $app.innerHTML = `<h1>Mistakes</h1><p class="mut">Questions whose last attempt was wrong. They leave this list when you get them right.</p>
  ${w.length ? `<div class="row" style="margin:14px 0"><button class="btn p" data-act="retryMistakes">Retry all ${w.length}</button></div>${w.map(q => reviewItem(q, null)).join('')}` : '<div class="empty">No mistakes recorded yet. Take a <a href="#quiz">quiz</a> to start.</div>'}`;
}

/* ---------- events ---------- */
const A = {
  toggleRead(p) { S.r = S.r || {}; S.r[p] = S.r[p] ? 0 : 1; save(); route(true); },
  flipDef(_, el) { el.classList.toggle('open'); },
  revealAll() { document.querySelectorAll('.dt').forEach(d => d.classList.add('open')); },
  fGot() { const s = F.steps[F.i]; S.r = S.r || {}; S.r[pid(F.id, s.i)] = 1; save(); fGo(1); },
  fSkip() { fGo(1); }, fBack() { fGo(-1); }, fNext() { fGo(1); },
  fAns(i) { const s = F.steps[F.i]; if (s.a !== null) return; s.a = s.o[+i]; record(s.q, s.a === s.q.c); focus(F.id); },
  fClose() { F = null; },
  weak() { pick = new Set(weakest(3)); qcfg = {n: 15, type: 'mix', src: 'all'}; startQuiz(shuffle(buildPool(picked(), qcfg)).slice(0, 15)); },
  quizTopic(id) { F = null; pick = new Set([id]); startQuiz(shuffle(Q.filter(q => q.t === id))); },
  cardsTopic(id) { F = null; pick = new Set([id]); sess.cards = null; location.hash = 'cards'; },
  pickAll() { pick.clear(); route(true); },
  pick(id) { pick.has(id) ? pick.delete(id) : pick.add(id); route(true); },
  startCards() { const pool = C.filter(c => picked().includes(c.t) && (!skipKnown || !S.k[c.id])); sess.cards = {deck: shuffle(pool), done: 0}; cards(); },
  resetCards() { S.k = {}; save(); cards(); },
  cardAgain() { cardNext(false); }, cardGot() { cardNext(true); },
  endCards() { if (sess.cards) sess.cards.deck = []; cards(); },
  startQuiz() { startQuiz(shuffle(buildPool(picked(), qcfg)).slice(0, qcfg.n)); },
  answer(i) { const s = sess.quiz, x = s.list[s.i]; if (x.a !== null) return; x.a = x.o[+i]; record(x.q, x.a === x.q.c); quiz(); },
  nextQ() { sess.quiz.i++; quiz(); },
  endQuiz() { sess.quiz = null; quiz(); },
  newQuiz() { sess.quiz = null; quiz(); },
  retryWrong() { startQuiz(shuffle(sess.quiz.wrong)); },
  retryMistakes() { startQuiz(shuffle(Q.filter(q => S.q[q.id] && !S.q[q.id][2]))); },
  startMock() {
    const mc = shuffle(Q.filter(q => q.type === 'mcq')), tf = shuffle(Q.filter(q => q.type === 'tf'));
    const list = shuffle(mc.slice(0, 25).concat(tf.slice(0, 5)));
    sess.mock = {list: list.map(q => ({q, o: q.type === 'tf' ? q.o : shuffle(q.o), a: null})), i: 0, left: 1800, end: Date.now() + 1800e3, done: false};
    mock(); startMockTimer();
  },
  goQ(i) { sess.mock.i = Math.max(0, Math.min(sess.mock.list.length - 1, +i)); mock(); },
  mockAns(i) { const s = sess.mock, x = s.list[s.i]; x.a = x.o[+i]; if (s.i < s.list.length - 1) s.i++; mock(); },
  submitMock() { const s = sess.mock, left = s.list.filter(x => x.a === null).length; if (left && !s.confirm) { s.confirm = true; const b = document.querySelector('[data-act=submitMock]'); b.textContent = `${left} unanswered — tap again to submit`; return; } submitMock(); },
  newMock() { sess.mock = null; mock(); },
  startMockB() { const a = B.assignments[Math.floor(Math.random() * B.assignments.length)]; startATimer(a.id); location.hash = 'assign-' + a.id; },
  startATimer() { startATimer(location.hash.slice(8)); route(); },
  stopATimer() { clearInterval(timers.b); aTimer = {id: null, left: 0}; route(); },
  reveal() { const id = location.hash.slice(8); S.a[id] = Object.assign(S.a[id] || {}, {show: 1, c: (S.a[id] || {}).c || [], n: B.assignments.find(x => x.id === id).checklist.length}); S.a[id].s = S.a[id].c.length; save(); route(); },
  hideModel() { const id = location.hash.slice(8); S.a[id].show = 0; save(); route(); },
  chk(i, el) { const id = location.hash.slice(8), r = S.a[id]; i = +i; r.c = r.c.filter(x => x !== i); if (el.checked) r.c.push(i); r.s = r.c.length; save(); document.getElementById('ascore').textContent = r.c.length + '/' + r.n; },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) { const f = A[el.dataset.act]; if (f) { if (el.tagName === 'BUTTON') e.preventDefault(); f(el.dataset.arg, el); } return; }
  const fc = e.target.closest('#fc'); if (fc) fc.classList.toggle('flip');
});
document.addEventListener('change', e => {
  if (e.target.id === 'skipk') { skipKnown = e.target.checked; cards(); }
  if (e.target.id === 'qn') { qcfg.n = +e.target.value; quiz(); }
  if (e.target.id === 'qt') { qcfg.type = e.target.value; quiz(); }
  if (e.target.id === 'qs') { qcfg.src = e.target.value; quiz(); }
});
let dT = null;
document.addEventListener('input', e => {
  if (e.target.id !== 'draft') return;
  const id = e.target.dataset.aid, v = e.target.value;
  document.getElementById('wc').textContent = v.trim().split(/\s+/).filter(Boolean).length + ' words';
  clearTimeout(dT); dT = setTimeout(() => { S.a[id] = Object.assign(S.a[id] || {}, {d: v}); save(); }, 800);
});
document.addEventListener('keydown', e => {
  if (/TEXTAREA|INPUT|SELECT|BUTTON|^A$/.test(e.target.tagName)) return;
  const v = (location.hash || '#home').slice(1).split('-')[0];
  if (v === 'focus' && F) {
    const s = F.steps[F.i];
    if (s.k === 'p' && (e.key === 'ArrowRight' || e.key === ' ')) { e.preventDefault(); A.fGot(); }
    else if (e.key === 'ArrowLeft') A.fBack();
    else if (s.k === 'q') { const k = '1234'.indexOf(e.key) >= 0 ? '1234'.indexOf(e.key) : 'abcd'.indexOf(e.key.toLowerCase()); if (s.a === null && k >= 0 && k < s.o.length) A.fAns(k); else if (s.a !== null && (e.key === 'Enter' || e.key === 'ArrowRight')) A.fNext(); }
  }
  if (v === 'cards' && sess.cards && sess.cards.deck.length) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); document.getElementById('fc').classList.toggle('flip'); }
    if (e.key === '1') cardNext(false); if (e.key === '2') cardNext(true);
  }
  if (v === 'quiz' && sess.quiz && sess.quiz.i < sess.quiz.list.length) {
    const x = sess.quiz.list[sess.quiz.i]; const k = '1234'.indexOf(e.key) >= 0 ? '1234'.indexOf(e.key) : 'abcd'.indexOf(e.key.toLowerCase());
    if (x.a === null && k >= 0 && k < x.o.length) A.answer(k);
    else if (x.a !== null && (e.key === 'Enter' || e.key === 'ArrowRight')) A.nextQ();
  }
});

fetch('bank.json').then(r => r.json()).then(d => { B = d; prep(); route(); })
  .catch(() => { $app.innerHTML = '<div class="empty">The question bank could not be loaded. Reload the page to try again.</div>'; });
}
</script>
</body>
</html>
